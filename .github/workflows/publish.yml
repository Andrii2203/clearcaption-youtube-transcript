# Publishes to PyPI via Trusted Publishing (no passwords) when a tag v* is pushed.
# PyPI side: pending publisher clearcaption / Andrii2203 / clearcaption-youtube-transcript / publish.yml / environment pypi
name: publish
on:
  push:
    tags: ["v*"]
jobs:
  publish:
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install build && python -m build
      - uses: pypa/gh-action-pypi-publish@release/v1
